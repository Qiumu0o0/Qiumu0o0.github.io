<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300" role="img" aria-labelledby="title desc">
  <title id="title">Current-state opacity example automaton</title>
  <desc id="desc">Initial state 0. Transitions: 0 to 1 on a; 1 to 3 on b; 0 to 2 on c; 2 to 4 on b.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="580" height="300" rx="12" fill="#fff"/>
  <g fill="none" stroke="#222" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 26 150 H 75"/>
    <path data-transition="0,a,1" d="M 123 141 L 257 89"/>
    <path data-transition="1,b,3" d="M 305 80 H 465"/>
    <path data-transition="0,c,2" d="M 123 159 L 257 211"/>
    <path data-transition="2,b,4" d="M 305 220 H 465"/>
  </g>
  <g fill="#fff" stroke="#222" stroke-width="2">
    <circle cx="100" cy="150" r="24"/>
    <circle cx="280" cy="80" r="24"/>
    <circle cx="280" cy="220" r="24"/>
    <circle cx="490" cy="80" r="24"/>
    <circle cx="490" cy="220" r="24"/>
  </g>
  <g fill="#222" font-family="'Times New Roman', Georgia, serif" font-size="24" text-anchor="middle" dominant-baseline="central">
    <text x="100" y="150">0</text>
    <text x="280" y="80">1</text>
    <text x="280" y="220">2</text>
    <text x="490" y="80">3</text>
    <text x="490" y="220">4</text>
  </g>
  <g fill="#222" font-family="'Times New Roman', Georgia, serif" font-size="24" font-style="italic" text-anchor="middle">
    <text x="190" y="99">a</text>
    <text x="385" y="66">b</text>
    <text x="190" y="211">c</text>
    <text x="385" y="206">b</text>
  </g>
</svg>
