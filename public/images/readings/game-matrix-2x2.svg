<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" role="img" aria-labelledby="title description">
  <title id="title">2×2 博弈矩阵</title>
  <desc id="description">Blue 的策略为 1 和 2，Red 的策略为 1 和 2；四种策略组合的收益均为 0。</desc>
  <rect width="560" height="400" rx="20" fill="#faf9f6"/>
  <g fill="#25334a" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="330" y="57" font-size="30" font-weight="600">Red</text>
    <text x="96" y="229" font-size="30" font-weight="600">Blue</text>
    <text x="245" y="111" font-size="26">1</text>
    <text x="415" y="111" font-size="26">2</text>
    <text x="158" y="193" font-size="26">1</text>
    <text x="158" y="303" font-size="26">2</text>
  </g>
  <rect x="190" y="130" width="280" height="220" rx="3" fill="#fff" stroke="#53657f" stroke-width="2.5"/>
  <path d="M330 130v220M190 240h280" fill="none" stroke="#53657f" stroke-width="2"/>
  <g fill="#25334a" font-family="Georgia, 'Times New Roman', serif" font-size="32" text-anchor="middle" dominant-baseline="middle">
    <text x="260" y="185">0</text>
    <text x="400" y="185">0</text>
    <text x="260" y="295">0</text>
    <text x="400" y="295">0</text>
  </g>
</svg>
