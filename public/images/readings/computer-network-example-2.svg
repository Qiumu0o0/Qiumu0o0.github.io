<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">四台电脑两两通过网线直接连接</title>
  <desc id="desc">PC1、PC2、PC3 和 PC4 两两相连，共需要六根网线</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf2ff"/>
      <stop offset="1" stop-color="#d7e5fa"/>
    </linearGradient>
  </defs>

  <rect width="900" height="620" rx="22" fill="#f8fafc"/>

  <g fill="none" stroke="#40556f" stroke-width="7" stroke-linecap="round">
    <path d="M230 165 H670"/>
    <path d="M230 455 H670"/>
    <path d="M230 165 V455"/>
    <path d="M670 165 V455"/>
    <path d="M230 165 L670 455"/>
    <path d="M670 165 L230 455"/>
  </g>

  <rect x="377" y="283" width="146" height="54" rx="27" fill="#f8fafc" stroke="#d3deeb" stroke-width="2"/>
  <text x="450" y="318" fill="#40556f" font-family="sans-serif" font-size="25" text-anchor="middle">网线 × 6</text>

  <g transform="translate(90 90)">
    <rect width="180" height="116" rx="12" fill="url(#screen)" stroke="#40556f" stroke-width="6"/>
    <rect x="15" y="15" width="150" height="80" rx="5" fill="#ffffff" opacity="0.72"/>
    <path d="M70 118 V148 M110 118 V148 M48 150 H132" fill="none" stroke="#40556f" stroke-width="7" stroke-linecap="round"/>
    <text x="90" y="59" fill="#293b53" font-family="sans-serif" font-size="30" font-weight="600" text-anchor="middle">PC1</text>
  </g>

  <g transform="translate(630 90)">
    <rect width="180" height="116" rx="12" fill="url(#screen)" stroke="#40556f" stroke-width="6"/>
    <rect x="15" y="15" width="150" height="80" rx="5" fill="#ffffff" opacity="0.72"/>
    <path d="M70 118 V148 M110 118 V148 M48 150 H132" fill="none" stroke="#40556f" stroke-width="7" stroke-linecap="round"/>
    <text x="90" y="59" fill="#293b53" font-family="sans-serif" font-size="30" font-weight="600" text-anchor="middle">PC2</text>
  </g>

  <g transform="translate(90 380)">
    <rect width="180" height="116" rx="12" fill="url(#screen)" stroke="#40556f" stroke-width="6"/>
    <rect x="15" y="15" width="150" height="80" rx="5" fill="#ffffff" opacity="0.72"/>
    <path d="M70 118 V148 M110 118 V148 M48 150 H132" fill="none" stroke="#40556f" stroke-width="7" stroke-linecap="round"/>
    <text x="90" y="59" fill="#293b53" font-family="sans-serif" font-size="30" font-weight="600" text-anchor="middle">PC3</text>
  </g>

  <g transform="translate(630 380)">
    <rect width="180" height="116" rx="12" fill="url(#screen)" stroke="#40556f" stroke-width="6"/>
    <rect x="15" y="15" width="150" height="80" rx="5" fill="#ffffff" opacity="0.72"/>
    <path d="M70 118 V148 M110 118 V148 M48 150 H132" fill="none" stroke="#40556f" stroke-width="7" stroke-linecap="round"/>
    <text x="90" y="59" fill="#293b53" font-family="sans-serif" font-size="30" font-weight="600" text-anchor="middle">PC4</text>
  </g>
</svg>
