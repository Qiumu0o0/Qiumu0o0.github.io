    <rect x="14" y="14" width="132" height="64" rx="5" fill="#ffffff" opacity="0.72"/>
    <path d="M61 100 V124 M99 100 V124 M41 126 H119" fill="none" stroke="#40556f" stroke-width="7" stroke-linecap="round"/>
    <text x="80" y="52" fill="#293b53" font-family="sans-serif" font-size="27" font-weight="600" text-anchor="middle">PC B</text>
  </g>
  <g transform="translate(270 470)">
    <rect width="160" height="98" rx="12" fill="url(#screen)" stroke="#40556f" stroke-width="6"/>
    <rect x="14" y="14" width="132" height="64" rx="5" fill="#ffffff" opacity="0.72"/>
    <path d="M61 100 V124 M99 100 V124 M41 126 H119" fill="none" stroke="#40556f" stroke-width="7" stroke-linecap="round"/>
    <text x="80" y="52" fill="#293b53" font-family="sans-serif" font-size="27" font-weight="600" text-anchor="middle">PC C</text>
  </g>
  <g transform="translate(770 100)">
