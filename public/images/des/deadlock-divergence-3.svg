<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 230" width="670" height="230" role="img" aria-labelledby="title desc">
  <title id="title">Four-state automaton with an unobservable cycle</title>
  <desc id="desc">Initial state q0 transitions by e1 labeled a to q1. Events e2, e3, and e4, all labeled epsilon, form a cycle from q1 to q2 to q3 and back to q1.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 1 L 7 4 L 0 7" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="670" height="230" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="1.4">
    <circle cx="90" cy="105" r="23"/>
    <circle cx="250" cy="105" r="23"/>
    <circle cx="410" cy="105" r="23"/>
    <circle cx="570" cy="105" r="23"/>
    <path d="M 20 105 H 66" marker-end="url(#arrow)"/>
    <path d="M 114 105 H 226" marker-end="url(#arrow)"/>
    <path d="M 274 105 H 386" marker-end="url(#arrow)"/>
    <path d="M 434 105 H 546" marker-end="url(#arrow)"/>
    <path d="M 570 128 C 570 200 250 200 250 128" marker-end="url(#arrow)"/>
  </g>
  <g fill="#111" font-family="Times New Roman, Times, serif" text-anchor="middle">
    <text x="90" y="111" font-size="20"><tspan font-style="italic">q</tspan><tspan font-size="12" baseline-shift="sub">0</tspan></text>
    <text x="250" y="111" font-size="20"><tspan font-style="italic">q</tspan><tspan font-size="12" baseline-shift="sub">1</tspan></text>
    <text x="410" y="111" font-size="20"><tspan font-style="italic">q</tspan><tspan font-size="12" baseline-shift="sub">2</tspan></text>
    <text x="570" y="111" font-size="20"><tspan font-style="italic">q</tspan><tspan font-size="12" baseline-shift="sub">3</tspan></text>
    <text x="170" y="92" font-size="18"><tspan font-style="italic">e</tspan><tspan font-size="11" baseline-shift="sub">1</tspan><tspan font-style="normal" baseline-shift="baseline">(a)</tspan></text>
    <text x="330" y="92" font-size="18"><tspan font-style="italic">e</tspan><tspan font-size="11" baseline-shift="sub">2</tspan><tspan font-style="normal" baseline-shift="baseline">(&#x03B5;)</tspan></text>
    <text x="490" y="92" font-size="18"><tspan font-style="italic">e</tspan><tspan font-size="11" baseline-shift="sub">3</tspan><tspan font-style="normal" baseline-shift="baseline">(&#x03B5;)</tspan></text>
    <text x="410" y="213" font-size="18"><tspan font-style="italic">e</tspan><tspan font-size="11" baseline-shift="sub">4</tspan><tspan font-style="normal" baseline-shift="baseline">(&#x03B5;)</tspan></text>
  </g>
</svg>
