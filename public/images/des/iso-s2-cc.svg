<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 235" role="img" aria-labelledby="title desc">
  <title id="title">Reachable part of the concurrent composition for the ISO check on S2</title>
  <desc id="desc">The check starts at (q0, empty set). It loops on epsilon and a, branches on b to (q1, empty set) and (q2, empty set), and (q1, empty set) loops on b. The right component is empty from the start.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 1 L 7 4 L 0 7" fill="none" stroke="#111" stroke-width="1.25"/>
    </marker>
  </defs>
  <rect width="760" height="235" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)">
    <path d="M 380 12 V 74"/>
    <path d="M 291 100 H 212"/>
    <path d="M 469 100 H 548"/>
    <path d="M 341 125 C 298 191 462 191 419 125"/>
    <path d="M 697 86 C 749 50 749 151 697 114"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.5">
    <ellipse cx="125" cy="100" rx="87" ry="27"/>
    <ellipse cx="380" cy="100" rx="89" ry="27"/>
    <ellipse cx="635" cy="100" rx="87" ry="27"/>
  </g>
  <g fill="#111" font-family="Cambria Math, Times New Roman, serif" font-size="18" text-anchor="middle">
    <text x="125" y="106">(q₂, ∅)</text><text x="380" y="106">(q₀, ∅)</text><text x="635" y="106">(q₁, ∅)</text>
    <text x="252" y="86">(b, b)</text><text x="508" y="86">(b, b)</text>
    <text x="380" y="197">(ε, ϵ)</text><text x="380" y="222">(a, a)</text>
    <text x="716" y="47">(b, b)</text>
  </g>
</svg>
