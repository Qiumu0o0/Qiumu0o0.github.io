<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 190" width="440" height="190" role="img" aria-labelledby="title desc">
  <title id="title">An infinite a-loop and a finite b-branch</title>
  <desc id="desc">The initial state q0 has a self-loop e1 labeled a and a transition e2 labeled b to q1.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 1 L 7 4 L 0 7" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="440" height="190" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="1.4">
    <circle cx="130" cy="120" r="23"/>
    <circle cx="330" cy="120" r="23"/>
    <path d="M 40 120 H 106" marker-end="url(#arrow)"/>
    <path d="M 154 120 H 306" marker-end="url(#arrow)"/>
    <path d="M 114 103 C 78 29 182 29 146 103" marker-end="url(#arrow)"/>
  </g>
  <g fill="#111" font-family="Times New Roman, Times, serif" text-anchor="middle">
    <text x="130" y="126" font-size="20"><tspan font-style="italic">q</tspan><tspan font-size="12" baseline-shift="sub">0</tspan></text>
    <text x="330" y="126" font-size="20"><tspan font-style="italic">q</tspan><tspan font-size="12" baseline-shift="sub">1</tspan></text>
    <text x="130" y="80" font-size="18"><tspan font-style="italic">e</tspan><tspan font-size="11" baseline-shift="sub">1</tspan><tspan font-style="normal" baseline-shift="baseline">(a)</tspan></text>
    <text x="230" y="107" font-size="18"><tspan font-style="italic">e</tspan><tspan font-size="11" baseline-shift="sub">2</tspan><tspan font-style="normal" baseline-shift="baseline">(b)</tspan></text>
  </g>
</svg>
